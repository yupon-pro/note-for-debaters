services:
  app:
    container_name: "note-for-debater"
    build: 
      context: .
      dockerfile: ./app/Dockerfile
    tty: true
    environment:
      TZ: Asia/Tokyo
    ports:
      - 8082:8080
    volumes:
      - type: bind
        source: ./app
        target: /app

  db:
    container_name: "note-for-debater-db"
    build:
      context: .
      dockerfile: ./db/Dockerfile
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    tty: true
    volumes:
      - postgres:/var/lib/posgresql/data
    ports:
      - 5432:5432

volumes:
  postgres: